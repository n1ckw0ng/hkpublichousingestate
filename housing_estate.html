<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Housing Estates (HK Public Rental Housing)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    h1 { margin: 16px; }
    #status { padding: 16px; background: #f0f8ff; border-left: 4px solid #007acc; margin: 0 16px; }
    #data-container { padding: 0 16px 16px; overflow-x: hidden; }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      table-layout: fixed; 
      font-size: 11px;
      margin: 0 16px 16px;
    }
    th, td { 
      border: 1px solid #ddd; 
      padding: 6px 8px; 
      vertical-align: top;
      white-space: normal;
    }
    thead { 
      position: sticky; 
      top: 0; 
      background: #f5f5f5; 
      z-index: 1; 
    }
    th { 
      cursor: pointer; 
      user-select: none;
      font-weight: 600;
    }
    th.sort-asc::after { content: " ^"; font-size: 10px; }
    th.sort-desc::after { content: " v"; font-size: 10px; }
    tr.highlight { background-color: #fff8d6 !important; }
    tr:hover { background: #f9f9f9; }
    .estate-link { 
      color: #0645ad; 
      text-decoration: underline; 
      cursor: pointer;
      display: block;
    }
    .estate-link:hover { color: #1a0dab; }
    .chinese { 
      font-family: "Noto Sans TC", sans-serif; 
      font-size: 10px;
      color: #333;
    }
    td a { word-break: break-all; }
    #map { 
      height: 400px; 
      margin: 0 16px 16px; 
      border: 1px solid #ccc; 
    }
    /* Column widths */
    th:nth-child(1), td:nth-child(1) { width: 16%; }
    th:nth-child(2), td:nth-child(2) { width: 9%; }
    th:nth-child(3), td:nth-child(3) { width: 7%; }
    th:nth-child(4), td:nth-child(4) { width: 9%; }
    th:nth-child(5), td:nth-child(5) { width: 6%; }
    th:nth-child(6), td:nth-child(6) { width: 9%; }
    th:nth-child(7), td:nth-child(7) { width: 6%; }
    th:nth-child(8), td:nth-child(8) { width: 11%; }
    th:nth-child(9), td:nth-child(9) { width: 7%; }
    th:nth-child(10), td:nth-child(10) { width: 7%; }
    th:nth-child(11), td:nth-child(11) { width: 9%; }
    th:nth-child(12), td:nth-child(12) { width: 13%; }
    th:nth-child(13), td:nth-child(13) { width: 9%; }
    th:nth-child(14), td:nth-child(14) { width: 9%; }
    th:nth-child(15), td:nth-child(15) { width: 6%; }
    th:nth-child(16), td:nth-child(16) { width: 11%; }
  </style>
</head>
<body>
  <h1>Housing Estates (HK Public Rental Housing)</h1>
  <div id="status">Loading...</div>
  <div id="map"></div>
  <div id="data-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400&display=swap" rel="stylesheet">
  
  <script>
    let map, estates = [], markerById = new Map();

    // Initialize map first
    map = L.map('map').setView([22.32, 114.17], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Load data
    document.addEventListener('DOMContentLoaded', function() {
      const status = document.getElementById('status');
      status.textContent = 'Loading data...';

      fetch('https://data.housingauthority.gov.hk/psi/rest/export/prh-estates?lang=en&format=json')
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(data => {
          estates = Array.isArray(data) ? data : (data.data || []);
          status.textContent = `✅ Loaded ${estates.length} estates!`;
          console.log('Sample estate:', estates[0]);
          
          // Sort by year
          estates.sort((a,b) => {
            const ya = parseInt(cleanYear(a.Year_of_Intake)) || 0;
            const yb = parseInt(cleanYear(b.Year_of_Intake)) || 0;
            return ya - yb;
          });
          
          createMarkers();
          createTable();
        })
        .catch(e => {
          status.textContent = '❌ Error: ' + e.message;
          console.error(e);
        });
    });

    function cleanYear(value) {
      return String(value || '').match(/\d{4}/)?.[0] || '';
    }

    function createMarkers() {
      estates.slice(0, 300).forEach((est, idx) => {
        const lat = parseFloat(est.Map_Latitude);
        const lon = parseFloat(est.Map_Longitude);
        if (!isNaN(lat) && !isNaN(lon)) {
          const estateId = est.Estate_ID || est.Estate_Code || String(idx);
          const popupText = `${est.Estate_Name || 'Estate'} (${cleanYear(est.Year_of_Intake) || '?'})`;
          const marker = L.marker([lat, lon]).addTo(map).bindPopup(popupText);
          markerById.set(estateId, marker);
        }
      });
      
      // Fit map to Hong Kong
      if (markerById.size > 0) {
        const bounds = L.latLngBounds(markerById.values().next().value.getLatLng());
        markerById.forEach(m => bounds.extend(m.getLatLng()));
        map.fitBounds(bounds.pad(0.1));
      }
    }

    function createTable() {
      const container = document.getElementById('data-container');
      const table = document.createElement('table');
      
      table.innerHTML = `
        <thead>
          <tr>
            <th data-key="Estate_Name">Estate Name</th>
            <th data-key="District_Name">District</th>
            <th data-key="Region_Name">Region</th>
            <th data-key="Type_of_Estate">Type of Estate</th>
            <th data-key="Year_of_Intake" data-type="number">Year of Intake</th>
            <th data-key="Type_of_Block">Type of Block</th>
            <th data-key="No_of_Blocks" data-type="number">No. of Blocks</th>
            <th data-key="Name_of_Block">Name of Block</th>
            <th data-key="No_of_Rental_Flats" data-type="number">No. of Rental Flats</th>
            <th data-key="Flat_Size_m2">Flat Size (m²)</th>
            <th data-key="Estate_Management_Advisory_Committee_EMAC">EMAC</th>
            <th data-key="District_Tenancy_Management_Office_Estate_Office">District Office</th>
            <th data-key="Property_Management">Property Management</th>
            <th data-key="Carpark_Management">Carpark Management</th>
            <th data-key="Estate_Website">Website</th>
            <th data-key="Further_Information">Further Info</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      `;
      
      container.appendChild(table);
      renderRows();
      addSorting(table);
    }

    function renderRows() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      
      estates.slice(0, 100).forEach((est, idx) => {
        const row = document.createElement('tr');
        const estateId = est.Estate_ID || est.Estate_Code || String(idx);
        row.dataset.estateId = estateId;
        
        const estateName = est.Estate_Name || 'Not available';
        const district = est.District_Name || 'Not available';
        const region = est.Region_Name || 'Not available';
        const year = cleanYear(est.Year_of_Intake) || 'Not available';
        
        row.innerHTML = `
          <td><span class="estate-link" data-lat="${est.Map_Latitude}" data-lon="${est.Map_Longitude}">${estateName}</span></td>
          <td>${district}</td>
          <td>${region}</td>
          <td>${est.Type_of_Estate || 'Not available'}</td>
          <td>${year}</td>
          <td>${est.Type_of_Block || 'Not available'}</td>
          <td>${est.No_of_Blocks || 'Not available'}</td>
          <td>${est.Name_of_Block || 'Not available'}</td>
          <td>${est.No_of_Rental_Flats || 'Not available'}</td>
          <td>${est.Flat_Size_m2 || 'Not available'}</td>
          <td>${est.Estate_Management_Advisory_Committee_EMAC || 'Not available'}</td>
          <td>${est.District_Tenancy_Management_Office_Estate_Office || 'Not available'}</td>
          <td>${est.Property_Management || 'Not available'}</td>
          <td>${est.Carpark_Management || 'Not available'}</td>
          <td>${est.Estate_Website ? `<a href="${est.Estate_Website}" target="_blank">Visit</a>` : 'Not available'}</td>
          <td>${est.Further_Information || 'None available'}</td>
        `;
        
        // Click handler for estate name
        const link = row.querySelector('.estate-link');
        link.addEventListener('click', function() {
          highlightRow(row);
          const lat = parseFloat(this.dataset.lat);
          const lon = parseFloat(this.dataset.lon);
          if (!isNaN(lat) && !isNaN(lon)) {
            map.setView([lat, lon], 16);
          }
        });
        
        tbody.appendChild(row);
      });
    }

    function addSorting(table) {
      table.querySelectorAll('th').forEach((th, idx) => {
        th.addEventListener('click', function() {
          const key = this.dataset.key;
          const type = this.dataset.type || 'string';
          
          // Clear sort indicators
          table.querySelectorAll('th').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
          
          // Toggle direction
          const dir = this.dataset.dir === 'asc' ? 'desc' : 'asc';
          this.dataset.dir = dir;
          this.classList.add(dir === 'asc' ? 'sort-asc' : 'sort-desc');
          
          // Sort
          estates.sort((a, b) => {
            let valA = key === 'Year_of_Intake' ? cleanYear(a[key]) : a[key];
            let valB = key === 'Year_of_Intake' ? cleanYear(b[key]) : b[key];
            
            if (type === 'number') {
              valA = parseFloat(valA) || 0;
              valB = parseFloat(valB) || 0;
              return dir === 'asc' ? valA - valB : valB - valA;
            } else {
              valA = (valA || '').toString().toLowerCase();
              valB = (valB || '').toString().toLowerCase();
              return valA < valB ? (dir === 'asc' ? -1 : 1) :
                     valA > valB ? (dir === 'asc' ? 1 : -1) : 0;
            }
          });
          
          renderRows();
        });
      });
    }

    function highlightRow(row) {
      document.querySelectorAll('tr.highlight').forEach(r => r.classList.remove('highlight'));
      row.classList.add('highlight');
    }
  </script>
</body>
</html>
